name: Dash
description: >-
  Dash is a peer-to-peer cryptocurrency network offering fast, low-cost payments with InstantSend,
  privacy via CoinJoin mixing, and decentralized governance through Masternodes. Developers can query
  blocks, transactions, addresses, UTXOs, governance objects, and real-time network events through
  the open-source Insight REST and WebSocket API, and can access Dash Platform layer-2 (DashPay
  identity, data contracts, documents, tokens) through the Decentralized API (DAPI) over gRPC and JSON-RPC.
