apis:
  - name: Dash Insight REST API
    description: >-
      Open-source REST and WebSocket API for querying the Dash Core (layer 1) blockchain. Provides
      endpoints for blocks (by hash or height), raw blocks, transactions (by txid), raw transactions,
      addresses (balance, total received/sent, UTXOs, transaction history), multi-address UTXO and
      transaction queries, transaction broadcast (standard and InstantSend), Dash governance objects
      (sporks, budget proposals, masternode votes), and network status. Real-time events (new blocks,
      new transactions, InstantSend locks) are streamed over socket.io WebSockets.
    humanURL: https://docs.dash.org/en/stable/developers/insight.html
    baseURL: https://insight.dash.org/insight-api
    tags:
      - Cryptocurrency
      - Dash
      - Blockchain
      - Block Explorer
      - Transactions
      - Addresses
      - InstantSend
      - Governance
      - WebSocket
    properties:
      - type: Documentation
        url: https://docs.dash.org/en/stable/developers/insight.html
      - type: GitHubRepository
        url: https://github.com/dashpay/insight-api
      - type: BlockExplorer
        url: https://explorer.dash.org/insight/
      - type: TestnetAPI
        url: https://testnet-insight.dash.org/insight-api

  - name: Dash Platform DAPI (Decentralized API)
    description: >-
      Decentralized HTTP API exposing gRPC and JSON-RPC endpoints for both Dash Core layer 1 and
      Dash Platform layer 2 (DashPay). Core gRPC endpoints cover broadcastTransaction, getBestBlockHeight,
      getBlockchainStatus, getTransaction, and real-time subscriptions (block headers with ChainLocks,
      masternode list, transactions with proofs). Platform gRPC endpoints cover identities (get, balance,
      keys, nonce), data contracts and their history, documents, state transition broadcast, governance
      vote polls, tokens (balances, supply, distribution), and system info (epochs, quorums, protocol
      version). JSON-RPC exposes getBestBlockHash and getBlockHash. Communication is secured with TLS;
      responses optionally include cryptographic Merkle proofs.
    humanURL: https://docs.dash.org/projects/platform/en/stable/docs/explanations/dapi.html
    baseURL: https://seed-1.networks.dash.org:1443
    tags:
      - Cryptocurrency
      - Dash
      - DashPay
      - Platform
      - gRPC
      - JSON-RPC
      - Identities
      - Data Contracts
      - Tokens
      - Governance
